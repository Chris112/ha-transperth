name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
          # Remove once the home-assistant/brands PR is merged (ROADMAP Phase 3).
          ignore: brands

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install "aiotransperth @ git+https://github.com/Chris112/aiotransperth" \
            pytest-homeassistant-custom-component ruff
      - run: ruff check .
      - run: pytest -q
